<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Where in Paul's Life Was Each Letter Written? using vis-timeline</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
</head>
<body>
<main>
    <header>
        <h1>Where in Paul's Life Was Each Letter Written?</h1>
        <span id="score">Accepted: 0 of 7</span>
    </header>

    <section id="panel" aria-live="polite"></section>

    <div id="tray" role="group" aria-label="Letter cards: drag one onto a period, or select it and click a period"></div>

    <div id="timeline"></div>

    <div id="bandkey"></div>

    <div id="toolbar">
        <button id="check-btn" class="primary" disabled>Check</button>
        <button id="restart-btn" title="Clear every placement and start again">Start over</button>
        <span id="status"></span>
    </div>
</main>
<script src="paul-letters-on-his-timeline.js"></script>
</body>
</html>
