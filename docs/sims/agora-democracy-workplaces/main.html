<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Democracy's Workplaces in the Agora</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; color: #1d2a33; background: white; }
        main { display: block; width: 100%; background: aliceblue; border: 1px solid silver; padding: 8px 12px 10px 12px; }
        .header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .header h1 { font-size: 20px; margin: 0 0 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score { font-size: 15px; white-space: nowrap; }
        #plan { display: block; width: 100%; height: 322px; background: white; border: 1px solid silver; border-radius: 10px; }
        #plan text { font-family: Arial, Helvetica, sans-serif; }
        #plan .lbl { font-size: 13px; fill: #1d2a33; pointer-events: none; }
        #plan .halo { paint-order: stroke; stroke: white; stroke-width: 3px; stroke-linejoin: round; }
        #plan .minor { font-size: 13px; fill: #5d6d78; }
        #plan .place { cursor: pointer; outline: none; }
        #plan .place .shape { fill: #e9dcc0; stroke: #8b7a55; stroke-width: 1.2; }
        #plan .place .hit { fill: transparent; stroke: none; }
        #plan .place:hover .shape, #plan .place:focus .shape { fill: #f6e7b8; }
        #plan .place.sel .shape { fill: #fff1c2; stroke: #c99a16; stroke-width: 3; }
        #plan .place.right .shape { fill: #dff2df; stroke: #2e7d32; stroke-width: 3; }
        #plan .place.wrong .shape { fill: #fbe3e3; stroke: #c62828; stroke-width: 3; }
        #plan .badge { cursor: pointer; }
        #plan .badge circle { stroke: white; stroke-width: 1.5; }
        #plan .badge text { font-size: 12px; font-weight: bold; fill: white; pointer-events: none; }
        #plan #street { display: none; }
        #plan.done #street { display: inline; }
        .info { background: #FFFBEA; border: 1px solid #D9C27A; border-radius: 8px; margin-top: 5px; padding: 5px 10px; font-size: 14px; line-height: 1.3; height: 46px; overflow: hidden; }
        .info .hint { color: dimgray; font-style: italic; }
        .panel { background: white; border: 1px solid silver; border-radius: 10px; padding: 7px 12px; margin-top: 5px; height: 160px; overflow: hidden; }
        .qhead { font-size: 12px; font-weight: bold; color: dimgray; margin: 0 0 2px 0; }
        .job { font-size: 16px; font-weight: bold; margin: 0 0 3px 0; line-height: 1.25; }
        .question { font-size: 14px; font-style: italic; color: #4a5a66; margin: 0 0 6px 0; }
        .answer-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .answer-row select { font-size: 14px; padding: 3px; max-width: 100%; }
        .answer-row button, .controls button { font-size: 14px; padding: 4px 12px; cursor: pointer; }
        button:disabled { cursor: default; }
        .feedback { font-size: 14px; margin-top: 6px; line-height: 1.35; }
        .feedback b.ok { color: darkgreen; }
        .feedback b.no { color: firebrick; }
        .controls { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        .status { font-size: 13px; color: dimgray; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        @media (max-width: 560px) {
            .header h1 { font-size: 16px; }
            .panel, .info { height: auto; min-height: 46px; }
            #plan { height: auto; }
        }
    </style>
</head>
<body>
    <main>
        <div class="header">
            <h1>Democracy's Workplaces in the Agora</h1>
            <div class="score" id="score">Correct: 0 of 0</div>
        </div>
        <svg id="plan" viewBox="0 0 700 344" role="img" aria-label="Schematic plan of the Ancient Agora of Athens, not to scale, with ten clickable places: the Royal Stoa, Stoa of Zeus Eleutherios, Bouleuterion, Metroon, Tholos and boundary stone along the west side, the Monument of the Eponymous Heroes on the square, the Temple of Hephaestus on the hill to the west, the Stoa Poikile north of the metro tracks, and the Stoa of Attalos on the east side"></svg>
        <div class="info" id="info" aria-live="polite"></div>
        <div class="panel" id="panel" aria-live="polite"></div>
        <div class="controls">
            <button id="nextBtn" disabled>Next card</button>
            <button id="restartBtn">Try Again</button>
            <span class="status" id="status"></span>
        </div>
    </main>
    <script src="agora-democracy-workplaces.js"></script>
</body>
</html>
