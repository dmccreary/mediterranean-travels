<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Who Could Vote in Athens? using Chart.js</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; background: white; color: #1d2a33; }
        main { display: block; width: 100%; background: aliceblue; border: 1px solid silver; padding: 8px 12px 10px 12px; }
        .header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .header h1 { font-size: 21px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score { font-size: 15px; white-space: nowrap; }
        .lead { font-size: 15px; font-style: italic; color: #34444f; margin: 3px 0 5px 0; }
        .chart-box { position: relative; height: 196px; background: white; border: 1px solid silver; border-radius: 10px; padding: 2px 8px 0 4px; }
        .note { font-size: 12.5px; color: #4a5a66; margin: 3px 2px 4px 2px; }
        .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; background: white; border: 1px solid silver; border-radius: 10px; padding: 5px 10px 6px 10px; }
        .srow { display: flex; flex-direction: column; }
        .srow label { font-size: 13px; display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
        .srow label .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
        .srow label .name { overflow: hidden; text-overflow: ellipsis; }
        .srow label b { font-variant-numeric: tabular-nums; }
        .srow input[type=range] { width: 100%; margin: 2px 0 0 0; }
        .srow input[type=range]:disabled { opacity: 0.45; }
        .readout { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; margin: 5px 2px 0 2px; }
        .readout b { font-variant-numeric: tabular-nums; }
        .readout .vote b { color: #8a6a10; }
        .panel { background: white; border: 1px solid silver; border-radius: 10px; padding: 7px 12px; margin-top: 5px; height: 150px; overflow: hidden; }
        .qhead { font-size: 12px; font-weight: bold; color: dimgray; margin: 0 0 2px 0; }
        .question { font-size: 16px; font-weight: bold; margin: 0 0 6px 0; line-height: 1.25; }
        .answer-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .answer-row input { font-size: 15px; width: 90px; padding: 3px 6px; }
        .answer-row button, .controls button { font-size: 14px; padding: 4px 12px; cursor: pointer; }
        .answer-row button:disabled, .controls button:disabled { cursor: default; }
        .answer-row .attempts { font-size: 13px; color: dimgray; }
        .feedback { font-size: 14px; margin-top: 6px; line-height: 1.35; }
        .feedback b.ok { color: darkgreen; }
        .feedback b.no { color: firebrick; }
        .controls { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        .status { font-size: 13px; color: dimgray; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        @media (max-width: 560px) {
            .sliders { grid-template-columns: 1fr; }
            .header h1 { font-size: 17px; }
            .panel { height: auto; min-height: 150px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="athens-who-could-vote.js"></script>
</head>
<body>
    <main>
        <div class="header">
            <h1>Who Could Vote in Athens?</h1>
            <div class="score" id="score">Challenges correct: 0 of 3</div>
        </div>
        <p class="lead">Athens was a democracy. How many of its people could vote?</p>
        <div class="chart-box">
            <canvas id="chart" role="img" aria-label="Stacked bar chart of the estimated population of Attica around 431 BCE in four groups, adult male citizens who could vote and three groups who could not, with a second bar for a full Assembly of 6,000"></canvas>
        </div>
        <p class="note">Estimates. No ancient census survives; these rounded ranges cover most modern estimates.</p>
        <div class="sliders" id="sliders"></div>
        <div class="readout">
            <span>Everyone in Attica: <b id="total">250,000</b></span>
            <span class="vote">Could vote: <b id="share">?</b></span>
            <span>Full Assembly: <b id="assembly">?</b></span>
        </div>
        <div class="panel" id="panel" aria-live="polite"></div>
        <div class="controls">
            <button id="nextBtn" disabled>Next challenge</button>
            <button id="restartBtn">Try Again</button>
            <span class="status" id="status"></span>
        </div>
    </main>
</body>
</html>
