# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Mediterranean Travels'
site_description: 'A day-by-day travel guide for a November 2026 journey from Istanbul to Athens, exploring the history of civilization, culture, cuisine, and the people who live along the way.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/mediterranean-travels/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/mediterranean-travels'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Trip Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - "1. Before We Go, Part 1: The Long Timeline of the Eastern Mediterranean": chapters/01-long-timeline/index.md
      - "2. Before We Go, Part 2: Traveling Well and the Learning for All Thread": chapters/02-traveling-well/index.md
      - "3. Day 1: Istanbul, a City on Two Continents": chapters/03-istanbul-two-continents/index.md
      - "4. Day 2: Byzantine Constantinople and Hagia Sophia": chapters/04-byzantine-constantinople/index.md
      - "5. Day 3: Ottoman Istanbul, Topkapı, and Friday Prayer": chapters/05-ottoman-istanbul/index.md
      - "6. Day 4: Bazaars, Scripts, and Presses": chapters/06-bazaars-scripts-presses/index.md
      - "7. Day 5: The End of Empire and the Birth of Modern Turkey": chapters/07-end-of-empire-modern-turkey/index.md
      - "8. Day 6: Troy and Gallipoli": chapters/08-troy-and-gallipoli/index.md
      - "9. Paul at Ephesus, Part 1: The Apostle's Life, Letters, and Ephesian Years": chapters/09-paul-life-letters/index.md
      - "10. Day 7: Ephesus, a Greco-Roman City": chapters/10-ephesus-greco-roman-city/index.md
      - "11. Paul at Ephesus, Part 2: Ideas, Legacy, and Lessons in Leading Change": chapters/11-paul-ideas-leadership/index.md
      - "12. Day 8: Rhodes, From the Colossus to the Knights": chapters/12-rhodes/index.md
      - "13. Day 9, Part 1: Knossos, the Minoans, and Linear B": chapters/13-knossos-minoans-linear-b/index.md
      - "14. Day 9, Part 2: Venetian Heraklion and Crete Today": chapters/14-venetian-heraklion/index.md
      - "15. Day 10: Athens, the Acropolis, and the Persian Wars": chapters/15-athens-acropolis/index.md
      - "16. Day 11: Athens, the Agora, Democracy, and Paul on the Areopagus": chapters/16-athens-agora-democracy/index.md
      - "17. The Oracle and the Algorithm, Part 1: The Oracle": chapters/17-oracle/index.md
      - "18. Day 12: Delphi": chapters/18-delphi/index.md
      - "19. The Oracle and the Algorithm, Part 2: The Algorithm": chapters/19-algorithm/index.md
      - "20. Day 13: Athens, Museums, Tutors, and the City Today": chapters/20-athens-museums-city-today/index.md
      - "21. Going Home: Learning With Communities, Not To Them": chapters/21-going-home/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Mascot Test: learning-graph/mascot-test.md

  - MicroSims:
    - List of MicroSims: sims/index.md
    - Eras of the Eastern Mediterranean Timeline: sims/eastern-med-eras-timeline/index.md
    - Learning Graph Viewer: sims/graph-viewer/index.md
    - Regions of the Eastern Mediterranean Map: sims/eastern-med-regions-map/index.md
    - Viking Cruise Map: sims/viking-cruise-map/index.md

  - Appendices:
    - List of Appendices: appendices/index.md
    - Trip Photo Metrics: appendices/photo-metrics.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  logo: img/logo.png  # 128px-tall copy of img/mascot/welcome.png
  favicon: img/favicon.ico
  palette:
    # Terracotta and olive theme; colors are defined in docs/css/extra.css
    primary: custom
    accent: custom
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Currency-safe math: inline is \(...\) only, never single $. Run
  # book-installer feature 5 (KaTeX) to add the renderer.
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['dollar', 'square']

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/cover-image-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | implemented | instrumented | approved
  # `instrumented` = the sim carries xAPI event handling (main.html loads lrs-sim.js and
  # the code calls LRSSim.create); the add-xapi-events-to-microsim skill's
  # scripts/sync-status.py sets it. Its icon is always the teal "signal" (MDI access-point).
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    implemented: Implemented — the MicroSim works
    instrumented: Instrumented — the MicroSim emits xAPI events; add ?xapi=teaching to the URL to see them
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Mediterranean Travels'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
