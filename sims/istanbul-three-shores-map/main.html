<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Istanbul's Three Shores using Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; color: #1d2a33; background: aliceblue; }
        main { display: block; width: 100%; }
        #header { height: 40px; padding: 6px 12px 0; background: #12304a; color: #fff; display: flex; align-items: baseline; gap: 12px; flex-wrap: nowrap; overflow: hidden; }
        #header h1 { font-size: 17px; margin: 0; font-weight: bold; white-space: nowrap; }
        #header span { font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #map { height: 420px; width: 100%; border-bottom: 1px solid silver; background: #d4dadc; }
        #quiz { height: 216px; padding: 8px 12px; background: white; border-top: 1px solid silver; display: flex; flex-direction: column; gap: 6px; }
        #qhead { display: flex; justify-content: space-between; font-size: 13px; color: #4a5a66; }
        #qhead b { color: #12304a; }
        #qtext { font-size: 16px; font-weight: bold; line-height: 1.3; }
        #choices { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        #choices button { font-size: 14px; line-height: 1.2; padding: 6px 6px; min-height: 36px; border: 2px solid #8aa0b0; border-radius: 6px; background: #f4f8fb; color: #1d2a33; cursor: pointer; }
        #choices button .sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #fff; box-shadow: 0 0 0 1px #555; }
        #choices button:hover:enabled { background: #e2edf5; border-color: #12304a; }
        #choices button:disabled { cursor: default; opacity: 0.55; }
        #choices button.correct { background: #dff2df; border-color: #2e7d32; opacity: 1; }
        #choices button.wrong { background: #fbe3e3; border-color: #c62828; opacity: 1; }
        #feedback { font-size: 13px; line-height: 1.35; flex: 1; overflow: hidden; }
        #feedback .ok { color: #2e7d32; font-weight: bold; }
        #feedback .no { color: #c62828; font-weight: bold; }
        #btnrow { display: flex; gap: 8px; align-items: center; }
        #btnrow button { font-size: 13px; padding: 6px 14px; border-radius: 6px; border: 1px solid #12304a; background: #12304a; color: #fff; cursor: pointer; }
        #btnrow button.ghost { background: #fff; color: #12304a; }
        #btnrow button:disabled { opacity: .35; cursor: default; }
        #btnrow .hint { font-size: 12px; color: #5d6d78; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .region-label { background: none; border: none; text-align: center; pointer-events: none; }
        .region-label div { display: inline-block; font-size: 13px; font-weight: bold; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; background: rgba(255,255,255,0.85); border-radius: 5px; padding: 2px 6px; }
        .region-label small { display: block; font-size: 11px; font-weight: normal; letter-spacing: 0; text-transform: none; color: #333; }
        .far .region-label small { display: none; }
        .far .region-label div { font-size: 12px; }
        .water-label { background: none; border: none; pointer-events: none; }
        .water-label div { font-size: 13px; font-style: italic; font-weight: bold; color: #cfe8ff; text-shadow: 0 0 3px #00213d, 0 0 3px #00213d; white-space: nowrap; text-align: center; }
        .place-label { background: rgba(255,255,255,0.88); border: none; box-shadow: none; padding: 0px 3px; font-size: 11px; font-weight: bold; color: #12304a; }
        .place-label::before { display: none; }
        .legend { background: rgba(255,255,255,0.92); padding: 5px 8px; border-radius: 6px; font-size: 11px; line-height: 1.5; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 4px; border: 2px solid #fff; box-shadow: 0 0 0 1px #555; }
        .leaflet-popup-content { font-size: 13px; line-height: 1.4; margin: 8px 10px; max-width: 240px; }
        .leaflet-popup-content b { color: #12304a; }
        @media (max-width: 560px) {
            #header span { display: none; }
            #choices button { font-size: 12px; }
            #btnrow .hint { display: none; }
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <main>
        <div id="header">
            <h1>Istanbul's Three Shores</h1>
            <span>Choose a shore first; then the place appears on the map</span>
        </div>
        <div id="map" role="application" aria-label="Map of Istanbul showing the historic peninsula, Galata and the Asian shore"></div>
        <div id="quiz">
            <div id="qhead"><span id="qnum"></span><span id="score"></span></div>
            <div id="qtext"></div>
            <div id="choices"></div>
            <div id="feedback" aria-live="polite"></div>
            <div id="btnrow">
                <button id="next" disabled>Next place</button>
                <button id="restart" class="ghost">Restart</button>
                <span class="hint">Keys 1 to 3 choose a shore; Enter goes on.</span>
            </div>
        </div>
    </main>
    <script src="istanbul-three-shores-map.js"></script>
</body>
</html>
