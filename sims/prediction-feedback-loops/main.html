<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>When a Prediction Feeds Itself using vis-network</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="edit-bar" hidden>
            <span class="edit-tag">Edit mode</span>
            <button type="button" id="copy-btn" class="btn">Copy JSON</button>
            <button type="button" id="download-btn" class="btn">Download JSON</button>
            <button type="button" id="reset-btn" class="btn secondary">Reset Layout</button>
            <span class="sep"></span>
            <span class="edge-tools-label">Selected edge:</span>
            <button type="button" id="flip-btn" class="btn secondary" disabled>Flip Curve</button>
            <button type="button" id="less-btn" class="btn secondary" disabled>Curve &minus;</button>
            <button type="button" id="more-btn" class="btn secondary" disabled>Curve +</button>
            <button type="button" id="straight-btn" class="btn secondary" disabled>Straight</button>
            <span class="sep"></span>
            <button type="button" id="prev-edit-btn" class="btn secondary">&larr; Loop</button>
            <button type="button" id="next-edit-btn" class="btn secondary">Loop &rarr;</button>
            <span id="edit-status" aria-live="polite"></span>
        </div>
        <header>
            <h1>When a Prediction Feeds Itself</h1>
            <span id="score">Links 0 of 10 · Loops 0 of 3 · Questions 0 of 3</span>
        </header>
        <div id="network-wrap">
            <div id="network" aria-label="A causal loop diagram of one prediction loop; each arrow is labeled with a plus or minus sign once it has been answered"></div>
            <div id="zoom-bar">
                <button type="button" id="zoom-in" class="zbtn" title="Zoom in">+</button>
                <button type="button" id="zoom-out" class="zbtn" title="Zoom out">&minus;</button>
                <button type="button" id="zoom-reset" class="zbtn wide" title="Fit the loop to the view">Reset view</button>
            </div>
            <div id="summary" hidden></div>
        </div>
        <div id="rule"></div>
        <div id="answer-bar" role="group" aria-label="Answer controls">
            <button type="button" id="a-btn" class="choice" aria-pressed="false">Same direction (+)</button>
            <button type="button" id="b-btn" class="choice" aria-pressed="false">Opposite direction (&minus;)</button>
            <button type="button" id="submit-btn" class="primary" disabled>Submit</button>
            <button type="button" id="next-btn" disabled>Next</button>
            <button type="button" id="again-btn">Start Over</button>
        </div>
        <section id="details" aria-live="polite"></section>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
    <script src="prediction-feedback-loops.js"></script>
</body>
</html>
