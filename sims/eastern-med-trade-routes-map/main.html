<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Trade Routes of the Eastern Mediterranean using Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; color: #1d2a33; background: aliceblue; }
        main { display: block; width: 100%; }
        #header { height: 40px; padding: 6px 12px 0; background: #12304a; color: #fff; display: flex; align-items: baseline; gap: 12px; flex-wrap: nowrap; overflow: hidden; }
        #header h1 { font-size: 17px; margin: 0; font-weight: bold; white-space: nowrap; }
        #header span { font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #map { height: 400px; width: 100%; border-bottom: 1px solid silver; background: #b9d3e6; }
        #quiz { height: 266px; padding: 8px 12px; background: white; border-top: 1px solid silver; display: flex; flex-direction: column; gap: 6px; }
        #qhead { display: flex; justify-content: space-between; font-size: 13px; color: #4a5a66; }
        #qhead b { color: #12304a; }
        #qtext { font-size: 15px; font-weight: bold; line-height: 1.3; min-height: 38px; }
        #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        #choices button { text-align: left; font-size: 13px; line-height: 1.25; padding: 6px 8px; min-height: 44px; border: 1px solid #8aa0b0; border-radius: 6px; background: #f4f8fb; color: #1d2a33; cursor: pointer; }
        #choices button:hover:enabled { background: #e2edf5; border-color: #12304a; }
        #choices button:disabled { cursor: default; opacity: 0.6; }
        #choices button.correct { background: #dff2df; border: 2px solid #2e7d32; opacity: 1; }
        #choices button.wrong { background: #fbe3e3; border: 2px solid #c62828; opacity: 1; }
        #feedback { font-size: 13px; line-height: 1.35; flex: 1; overflow: hidden; }
        #feedback .ok { color: #2e7d32; font-weight: bold; }
        #feedback .no { color: #c62828; font-weight: bold; }
        #btnrow { display: flex; gap: 8px; align-items: center; }
        #btnrow button { font-size: 13px; padding: 6px 14px; border-radius: 6px; border: 1px solid #12304a; background: #12304a; color: #fff; cursor: pointer; }
        #btnrow button.ghost { background: #fff; color: #12304a; }
        #btnrow button:disabled { opacity: .35; cursor: default; }
        #btnrow .hint { font-size: 12px; color: #5d6d78; }
        .place-label { background: rgba(255,255,255,0.85); border: none; box-shadow: none; padding: 0px 3px; font-size: 11px; font-weight: bold; color: #12304a; }
        .place-label::before { display: none; }
        .route-arrow svg { display: block; overflow: visible; }
        .legend { background: rgba(255,255,255,0.92); padding: 5px 8px; border-radius: 6px; font-size: 11px; line-height: 1.45; box-shadow: 0 1px 4px rgba(0,0,0,0.3); max-width: 230px; }
        .legend .lt { font-weight: bold; color: #12304a; }
        .legend .sw { display: inline-block; width: 18px; height: 4px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
        .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 4px; border: 2px solid #fff; box-shadow: 0 0 0 1px #12304a; }
        .leaflet-popup-content { font-size: 13px; line-height: 1.4; margin: 10px 12px; }
        .leaflet-popup-content b { color: #12304a; }
        @media (max-width: 520px) {
            #header span { display: none; }
            #choices { grid-template-columns: 1fr; }
            #choices button { min-height: 32px; }
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <main>
        <div id="header">
            <h1>Trade Routes of the Eastern Mediterranean</h1>
            <span>Simplified routes: predict first, then see the route</span>
        </div>
        <div id="map" role="application" aria-label="Map of 16 ancient ports and places in the Eastern Mediterranean"></div>
        <div id="quiz">
            <div id="qhead"><span id="qnum"></span><span id="score"></span></div>
            <div id="qtext"></div>
            <div id="choices"></div>
            <div id="feedback" aria-live="polite"></div>
            <div id="btnrow">
                <button id="next" disabled>Next question</button>
                <button id="restart" class="ghost">Restart</button>
                <span class="hint">Click any place or revealed route to read about it.</span>
            </div>
        </div>
    </main>
    <script src="eastern-med-trade-routes-map.js"></script>
</body>
</html>
