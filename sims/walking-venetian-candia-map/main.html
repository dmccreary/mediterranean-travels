<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Walking Venetian Candia using Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; color: #1d2a33; background: aliceblue; }
        main { display: block; width: 100%; }
        #header { height: 40px; padding: 6px 12px 0; background: #5a1f1a; color: #fff; display: flex; align-items: baseline; gap: 12px; flex-wrap: nowrap; overflow: hidden; }
        #header h1 { font-size: 17px; margin: 0; font-weight: bold; white-space: nowrap; }
        #header span { font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #map { height: 440px; width: 100%; border-bottom: 1px solid silver; background: #dfe6ea; cursor: crosshair; }
        #map.done { cursor: grab; }
        #quiz { height: 176px; padding: 8px 12px; background: white; border-top: 1px solid silver; display: flex; flex-direction: column; gap: 6px; }
        #qhead { display: flex; justify-content: space-between; font-size: 13px; color: #4a5a66; }
        #qhead b { color: #5a1f1a; }
        #qtext { font-size: 16px; font-weight: bold; line-height: 1.3; }
        #qtext small { font-weight: normal; font-size: 13px; color: #4a5a66; }
        #feedback { font-size: 13px; line-height: 1.35; flex: 1; overflow: hidden; }
        #feedback .ok { color: #2e7d32; font-weight: bold; }
        #feedback .no { color: #c62828; font-weight: bold; }
        #feedback .here { color: #8a4b00; font-weight: bold; }
        #btnrow { display: flex; gap: 8px; align-items: center; }
        #btnrow button { font-size: 13px; padding: 6px 14px; border-radius: 6px; border: 1px solid #5a1f1a; background: #5a1f1a; color: #fff; cursor: pointer; }
        #btnrow button.ghost { background: #fff; color: #5a1f1a; }
        #btnrow button:disabled { opacity: .35; cursor: default; }
        #btnrow .hint { font-size: 12px; color: #5d6d78; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .water-label { background: none; border: none; pointer-events: none; }
        .water-label div { font-size: 13px; font-style: italic; font-weight: bold; color: #2b5d80; white-space: nowrap; text-align: center; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
        .place-label { background: rgba(255,255,255,0.92); border: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); padding: 0px 4px; font-size: 11px; font-weight: bold; color: #5a1f1a; }
        .place-label::before { display: none; }
        .dist-label { background: rgba(255,255,255,0.92); border: none; box-shadow: none; padding: 0px 3px; font-size: 11px; font-weight: bold; color: #333; }
        .dist-label::before { display: none; }
        .walk-label { background: rgba(255,255,255,0.92); border: none; box-shadow: none; padding: 0px 4px; font-size: 11px; font-weight: bold; color: #1565c0; }
        .walk-label::before { display: none; }
        .legend { background: rgba(255,255,255,0.92); padding: 5px 8px; border-radius: 6px; font-size: 11px; line-height: 1.6; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 4px; border: 2px solid #fff; box-shadow: 0 0 0 1px #555; }
        .legend .ln { display: inline-block; width: 16px; height: 0; border-top: 3px dashed #1565c0; vertical-align: middle; margin-right: 4px; }
        .leaflet-popup-content { font-size: 13px; line-height: 1.4; margin: 8px 10px; max-width: 240px; }
        .leaflet-popup-content b { color: #5a1f1a; }
        @media (max-width: 560px) {
            #header span { display: none; }
            #btnrow .hint { display: none; }
            #feedback { font-size: 12px; }
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <main>
        <div id="header">
            <h1>Walking Venetian Candia</h1>
            <span>Click the map where each landmark stands; within 150 m counts</span>
        </div>
        <div id="map" role="application" aria-label="Unlabeled street map of the old town of Heraklion, with the Venetian harbor and walls"></div>
        <div id="quiz">
            <div id="qhead"><span id="qnum"></span><span id="score"></span></div>
            <div id="qtext"></div>
            <div id="feedback" aria-live="polite"></div>
            <div id="btnrow">
                <button id="next" disabled>Next card</button>
                <button id="restart" class="ghost">Try Again</button>
                <span class="hint">Zoom with + and &minus;; the mouse wheel scrolls the page. Enter goes on.</span>
            </div>
        </div>
    </main>
    <script src="walking-venetian-candia-map.js"></script>
</body>
</html>
