<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Xerxes' Road to Salamis using Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; color: #1d2a33; background: aliceblue; }
        main { display: block; width: 100%; }
        #header { height: 40px; padding: 6px 12px 0; background: #6b1d14; color: #fff; display: flex; align-items: baseline; gap: 12px; flex-wrap: nowrap; overflow: hidden; }
        #header h1 { font-size: 17px; margin: 0; font-weight: bold; white-space: nowrap; }
        #header span { font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #map { height: 410px; width: 100%; border-bottom: 1px solid silver; background: #b9d3e6; }
        #quiz { height: 270px; padding: 8px 12px; background: white; border-top: 1px solid silver; display: flex; flex-direction: column; gap: 6px; }
        #qhead { display: flex; justify-content: space-between; font-size: 13px; color: #4a5a66; }
        #qhead b { color: #6b1d14; }
        #qtext { font-size: 15px; font-weight: bold; line-height: 1.3; }
        #qtext small { font-weight: normal; font-size: 13px; color: #4a5a66; }
        #choices { display: flex; flex-direction: column; gap: 4px; }
        #choices:empty { display: none; }
        #choices button { font-size: 13px; line-height: 1.25; text-align: left; padding: 4px 8px; min-height: 30px; border: 2px solid #8aa0b0; border-radius: 6px; background: #f4f8fb; color: #1d2a33; cursor: pointer; }
        #choices button:hover:enabled { background: #e2edf5; border-color: #6b1d14; }
        #choices button:disabled { cursor: default; opacity: 0.55; }
        #choices button.correct { background: #dff2df; border-color: #2e7d32; opacity: 1; }
        #choices button.wrong { background: #fbe3e3; border-color: #c62828; opacity: 1; }
        #feedback { font-size: 13px; line-height: 1.35; flex: 1; overflow-y: auto; }
        #feedback .ok { color: #2e7d32; font-weight: bold; }
        #feedback .no { color: #c62828; font-weight: bold; }
        #feedback .ctx { color: #4a5a66; font-style: italic; }
        #feedback .dt { color: #6b1d14; font-weight: bold; }
        #btnrow { display: flex; gap: 8px; align-items: center; }
        #btnrow button { font-size: 13px; padding: 6px 14px; border-radius: 6px; border: 1px solid #6b1d14; background: #6b1d14; color: #fff; cursor: pointer; }
        #btnrow button.ghost { background: #fff; color: #6b1d14; }
        #btnrow button:disabled { opacity: .35; cursor: default; }
        #btnrow .hint { font-size: 12px; color: #5d6d78; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        /* Fractional zoom: overlap tiles by 1px with normal blending, so no seams show */
        .leaflet-container img.leaflet-tile { mix-blend-mode: normal; width: 257px !important; height: 257px !important; }
        .num-icon div { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #6b1d14; color: #6b1d14; font-size: 11px; font-weight: bold; line-height: 16px; text-align: center; box-shadow: 0 0 0 1px #fff; }
        .num-icon.cur div { background: #ffd54a; width: 24px; height: 24px; line-height: 20px; font-size: 12px; margin: -2px 0 0 -2px; }
        .num-icon.extra div { border-style: dashed; }
        .place-label { background: rgba(255,255,255,0.92); border: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); padding: 0px 4px; font-size: 11px; font-weight: bold; color: #6b1d14; }
        .place-label::before { display: none; }
        .water-label { background: none; border: none; pointer-events: none; }
        .water-label div { font-size: 12px; font-style: italic; font-weight: bold; color: #2b5d80; white-space: nowrap; text-align: center; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
        .land-label div { color: #5d4a2c; font-style: normal; font-size: 11px; letter-spacing: 1px; }
        #key { height: 24px; padding: 4px 12px 0; background: #f7f3ea; font-size: 11px; color: #33414b; display: flex; gap: 12px; white-space: nowrap; overflow: hidden; }
        #key .ln { display: inline-block; width: 18px; height: 0; vertical-align: middle; margin-right: 4px; }
        #key .note { color: #5d6d78; font-style: italic; overflow: hidden; text-overflow: ellipsis; }
        .legend { background: rgba(255,255,255,0.93); padding: 5px 8px; border-radius: 6px; font-size: 11px; line-height: 1.55; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .legend .ln { display: inline-block; width: 20px; height: 0; vertical-align: middle; margin-right: 5px; }
        .legend .note { color: #5d6d78; font-style: italic; }
        .leaflet-popup-content { font-size: 13px; line-height: 1.4; margin: 8px 10px; max-width: 240px; }
        .leaflet-popup-content b { color: #6b1d14; }
        @media (max-width: 600px) {
            #header span { display: none; }
            #btnrow .hint { display: none; }
            #choices button { font-size: 12px; }
            #key .note { display: none; }
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <main>
        <div id="header">
            <h1>Xerxes' Road to Salamis</h1>
            <span>The Persian Wars in ten places, 498&ndash;479 BCE; routes simplified</span>
        </div>
        <div id="map" role="application" aria-label="Map of the Aegean from Sardis to Thermopylae, showing the places of the Persian Wars one step at a time"></div>
        <div id="key" aria-label="Map key"></div>
        <div id="quiz">
            <div id="qhead"><span id="qnum"></span><span id="score"></span></div>
            <div id="qtext"></div>
            <div id="choices"></div>
            <div id="feedback" aria-live="polite"></div>
            <div id="btnrow">
                <button id="back" class="ghost">Back</button>
                <button id="next">Next place</button>
                <button id="restart" class="ghost">Start Again</button>
                <span class="hint" id="hint">Keys A, B, C choose; Enter goes on.</span>
            </div>
        </div>
    </main>
    <script src="persian-wars-campaign-map.js"></script>
</body>
</html>
