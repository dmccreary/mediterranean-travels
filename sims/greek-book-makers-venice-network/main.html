<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Who Made a Greek Book in Venice? using vis-network</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; color: #1d2a33; background: aliceblue; }
        main { display: block; width: 100%; }
        header { height: 40px; padding: 6px 12px 0; background: #1f3f5f; color: #fff; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; overflow: hidden; }
        header h1 { font-size: 17px; margin: 0; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        header #score { font-size: 13px; white-space: nowrap; }
        #network-wrap { position: relative; height: 350px; background: #fbfaf6; border-bottom: 1px solid silver; }
        #network { position: absolute; inset: 0; }
        #zoom-bar { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 5; }
        .zbtn { font-size: 14px; min-width: 28px; height: 26px; border: 1px solid #8aa0b0; border-radius: 5px; background: #fff; color: #1f3f5f; cursor: pointer; padding: 0 6px; }
        .zbtn:hover { background: #e2edf5; }
        #info { position: absolute; left: 8px; top: 8px; max-width: 270px; background: rgba(255,255,255,0.96); border: 1px solid #b9c6cf; border-radius: 6px; padding: 6px 8px; font-size: 12px; line-height: 1.35; box-shadow: 0 1px 4px rgba(0,0,0,0.2); z-index: 5; }
        #info b { color: #1f3f5f; }
        #info .crete { color: #8a5a00; font-weight: bold; }
        #info .close { float: right; border: none; background: none; font-size: 14px; cursor: pointer; color: #555; padding: 0 0 0 6px; }
        #hint { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #5d6d78; z-index: 4; pointer-events: none; }
        #quiz { height: 236px; padding: 8px 12px; background: white; display: flex; flex-direction: column; gap: 6px; }
        #qhead { display: flex; justify-content: space-between; font-size: 13px; color: #4a5a66; }
        #qhead b { color: #1f3f5f; }
        #qtext { font-size: 15px; font-weight: bold; line-height: 1.3; min-height: 39px; }
        #qtext small { font-weight: normal; font-size: 12px; color: #4a5a66; }
        #choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        #choices button { font-size: 13px; line-height: 1.15; padding: 5px 4px; min-height: 30px; border: 2px solid #8aa0b0; border-radius: 6px; background: #f4f8fb; color: #1d2a33; cursor: pointer; }
        #choices button:hover:enabled { background: #e2edf5; border-color: #1f3f5f; }
        #choices button:disabled { cursor: default; opacity: 0.5; }
        #choices button.correct { background: #dff2df; border-color: #2e7d32; opacity: 1; }
        #choices button.wrong { background: #fbe3e3; border-color: #c62828; opacity: 0.8; }
        #crete { display: none; align-items: center; gap: 8px; font-size: 14px; }
        #crete input { width: 70px; font-size: 15px; padding: 3px 4px; }
        #crete button { font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid #1f3f5f; background: #1f3f5f; color: #fff; cursor: pointer; }
        #crete button:disabled { opacity: .35; cursor: default; }
        #feedback { font-size: 13px; line-height: 1.35; flex: 1; overflow: hidden; }
        #feedback .ok { color: #2e7d32; font-weight: bold; }
        #feedback .no { color: #c62828; font-weight: bold; }
        #btnrow { display: flex; gap: 8px; align-items: center; }
        #btnrow button { font-size: 13px; padding: 6px 14px; border-radius: 6px; border: 1px solid #1f3f5f; background: #1f3f5f; color: #fff; cursor: pointer; }
        #btnrow button.ghost { background: #fff; color: #1f3f5f; }
        #btnrow button:disabled { opacity: .35; cursor: default; }
        #btnrow .note { font-size: 12px; color: #5d6d78; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        @media (max-width: 560px) {
            #choices { grid-template-columns: repeat(5, 1fr); }
            #choices button { font-size: 11px; padding: 4px 2px; }
            #btnrow .note { display: none; }
            header #score { font-size: 12px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Who Made a Greek Book in Venice?</h1>
            <span id="score"></span>
        </header>
        <div id="network-wrap">
            <div id="network" aria-label="Ten people of Venetian Greek printing around 1500, shown as boxes; links appear as their contributions are attributed"></div>
            <div id="zoom-bar">
                <button type="button" id="zoom-in" class="zbtn" title="Zoom in">+</button>
                <button type="button" id="zoom-out" class="zbtn" title="Zoom out">&minus;</button>
                <button type="button" id="zoom-reset" class="zbtn" title="Fit the network to the view">Reset view</button>
            </div>
            <div id="info" hidden></div>
            <div id="hint">Click a person you have already placed to read about them.</div>
        </div>
        <div id="quiz">
            <div id="qhead"><span id="qnum"></span><span id="role-note"></span></div>
            <div id="qtext"></div>
            <div id="choices" role="group" aria-label="Choose a person"></div>
            <div id="crete">
                <label for="crete-input">Your answer:</label>
                <input id="crete-input" type="number" min="0" max="10" aria-label="Number of the ten born on Crete">
                <button type="button" id="crete-check">Check</button>
            </div>
            <div id="feedback" aria-live="polite"></div>
            <div id="btnrow">
                <button type="button" id="next" disabled>Next card</button>
                <button type="button" id="again" class="ghost">Try Again</button>
                <span class="note">Only your first choice on each card is scored.</span>
            </div>
        </div>
    </main>
    <script src="greek-book-makers-venice-network.js"></script>
</body>
</html>
